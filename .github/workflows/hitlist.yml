name: Hitlist Tracker

on: fork

permissions: write-all

jobs:
  updateTracker:
    name: Update Hitlist Tracker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Update Hitlist File
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");

            const forker = context.payload.forkee.owner.login;
            const forkUrl = context.payload.forkee.html_url;
            const forkDate = new Date();

            let hitlistRawFile = fs.readFileSync("hitlist.md", "utf8");

            // dox the guy that forked the repo muahaahahahah
            hitlistRawFile += "\n";
            hitlistRawFile += forker + "\n";
            hitlistRawFile += forkUrl + "\n";
            hitlistRawFile += forkDate.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"}) + "\n";

            const latestRef = github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });

            const latestCommit = github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: latestRef.object.sha
            });

            const hitlistBlob = github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: hitlistRawFile,
              encoding: "utf-8"
            });

            const newTree = github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: latestCommit.tree.sha,
              tree: [{
                path: "hitlist.md",
                mode: "100644", // this number means: https://git-scm.com/book/en/v2/Git-Internals-Git-Objects#:~:text=In%20this%20case%2C%20you%E2%80%99re%20specifying%20a%20mode%20of%20100644%2C%20which%20means%20it%E2%80%99s%20a%20normal%20file.
                type: "blob",
                sha: hitlistBlob.sha
              }],
            });

            const newCommit = github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree: newTree.sha,
              message: "Updated Hitlist Tracker file",
              parents: [latestRef.object.sha]
            });

            github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
              sha: newCommit.sha
            });
