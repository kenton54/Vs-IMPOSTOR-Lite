            export/release/ios/haxe/
            export/release/ios/obj/

      - name: Install Haxelib and Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp master
          chmod +x ./setup/setup.sh
          sh ./setup/setup.sh

      - name: Setup HXCPP
        run: |
          cd ~/haxelib/hxcpp/git/tools/hxcpp/
          haxe compile.hxml
          cd ~/

      - name: Build Game
        run: haxelib run lime build ios

      - name: Publish Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Impostor Lite (iOS XCode Project)
          path: export/release/ios/bin

      - name: Clear old Cache
        uses: actions/github-script@v8
        if: ${{ steps.cache-restore.outputs.cache-hit == 'true' }}
        with:
          script: |
            const caches = github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: "cache_ios"
            });

      - name: Save new Cache
        uses: actions/cache/save@v5
        with:
          key: cache_ios
          path: |
            .haxelib/
            export/release/ios/haxe/
            export/release/ios/obj/
