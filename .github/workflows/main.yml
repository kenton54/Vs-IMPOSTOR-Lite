name: Build

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]

  workflow_dispatch:

jobs:
  buildLinux:
    name: Linux Build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Pulling new Commit
        uses: actions/checkout@v5
      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Install Haxelib and Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp
      - name: Install LibVLC
        run: |
            sudo apt-get install libvlc-dev libvlccore-dev
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa
      - name: Build Game
        run: |
          haxelib run lime build linux
      - name: Publish Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Impostor Lite (Linux)
          path: 'export/release/linux/bin'

  buildWindows:
    name: Windows Build
    runs-on: windows-latest
    permissions: write-all
    steps:
      - name: Pulling new Commit
        uses: actions/checkout@v5
      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Install Haxelib and Libraries
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp
        shell: cmd
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd
      - name: Build Game
        run: haxelib run lime build windows
      - name: Publish Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Impostor Lite (Windows)
          path: export/release/windows/bin

  buildMac:
    name: MacOS Build
    runs-on: macos-latest
    permissions: write-all
    steps:
      - name: Pulling new Commit
        uses: actions/checkout@v5
      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Install/Update Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa
      - name: Build Game
        run: arch -x86_64 haxelib run lime build mac
      - name: Publish Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Impostor Lite (MacOS)
          path: export/release/macos/bin
